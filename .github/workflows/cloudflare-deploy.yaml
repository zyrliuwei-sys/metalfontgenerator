# Deploys the Worker on every push to main.
#
# Requires one repo secret (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN — create in Cloudflare dashboard with the
#   "Edit Cloudflare Workers" API token template.
# (CLOUDFLARE_ACCOUNT_ID is not secret and is set below.)
#
# Deploys CODE only. Database schema changes (src/config/db/schema.ts +
# the schema.*.ts templates) still need a reviewed local migration BEFORE
# pushing: `pnpm db:generate` → review the SQL in /drizzle → `pnpm db:migrate`
# against the production DATABASE_URL. CI never touches the database.
name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_ACCOUNT_ID: d7c3d8fa2229ed65b03fd28fc8659989
      DATABASE_PROVIDER: postgresql # postinstall copies the postgres schema template
      VITE_APP_URL: https://metalfontgenerator.org
      VITE_APP_NAME: metalfontgeneratorai
      HUSKY: '0' # skip git hooks in CI
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate deployment inputs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -f wrangler.jsonc || { echo "Missing wrangler.jsonc deployment config"; exit 1; }
          grep -q '"metalfontgenerator.org"' wrangler.jsonc || { echo "wrangler.jsonc is not configured for metalfontgenerator.org"; exit 1; }

      - name: Build and deploy
        run: pnpm run cf:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
